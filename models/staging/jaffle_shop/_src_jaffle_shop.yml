sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    tables:
      - name: customers 
        columns:
          - name: id 
            data_tests:
              - unique
              - not_null
      - name: orders
        columns:
          - name: id 
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after: 
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at
      
models:
  - name: stg_jaffle_shop__customers
    description: The grain of this table is one unique customer per row. 
    columns:
      - name: customer_id
        description: Primary key for the customers table
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: The grain is one unique order per row. 
    columns:
      - name: order_id 
        description: Primary key for the orders table
        data_tests:
          - unique 
          - not_null 
      - name: order_status
        data_tests:
         - accepted_values:
             arguments:
               values: ['completed', 'shipped', 'placed', 'return_pending', 'returned']
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                field: customer_id 
                to: ref('stg_jaffle_shop__customers')